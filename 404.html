<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to New Orleans Arts &amp; Ideas Festival</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://fest.philosophers.group/">
<script>
  // Genuinely unrecognized paths land here (every known live page from
  // noai.philosophers.group's WordPress sitemaps has its own real,
  // 200-status redirect page instead - see the repo root and its
  // subdirectories - so a real 404 status here is appropriate; this is
  // just a safety net rather than a dead end).
  //
  // One exception: a single presentation's WP slug is literal percent-hex
  // text from an emoji-heavy title (e.g. "you-and-%f0%9f%91%81...-i"),
  // which isn't safe to use as a real directory name here - the new site
  // sanitizes it too (see fest's src/lib/slug.js) - so it's special-cased
  // here instead of getting its own redirect page like every other path.
  var target = /^\/presentations\/you-and-/.test(location.pathname)
    ? "https://fest.philosophers.group/p/you-and-a-i-i/"
    : "https://fest.philosophers.group/";
  location.replace(target);
</script>
</head>
<body>
<p>This page has moved to the New Orleans Arts &amp; Ideas Festival site. If you are not redirected automatically,
<a href="https://fest.philosophers.group/">click here</a>.</p>
</body>
</html>
